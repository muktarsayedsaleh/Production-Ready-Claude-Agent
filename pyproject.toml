[project]
name = "production-ready-claude-agent"
version = "0.1.0"
description = "A production-ready Claude agent template you can clone, run with one command, and ship."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muktar Sayed Saleh" }]
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "anthropic",
    "redis",
    "psycopg[binary]",
    "pyyaml",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[dependency-groups]
dev = [
    "fakeredis",
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
